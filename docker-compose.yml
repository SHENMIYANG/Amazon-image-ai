version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - IMAGE_GEN_API_KEY=${IMAGE_GEN_API_KEY}
      - IMAGE_GEN_BASE_URL=${IMAGE_GEN_BASE_URL}
      - IMAGE_GENERATION_MODEL=${IMAGE_GENERATION_MODEL}
      - AGENT_API_KEY=${AGENT_API_KEY}
      - AGENT_BASE_URL=${AGENT_BASE_URL}
      - AGENT_MODEL=${AGENT_MODEL}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-14}
      - BOOTSTRAP_ADMIN_LOGIN=${BOOTSTRAP_ADMIN_LOGIN}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION:-us-east-1}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY}
      - STORAGE_S3_FORCE_PATH_STYLE=${STORAGE_S3_FORCE_PATH_STYLE:-true}
    restart: always
    volumes:
      - ./logs:/app/logs
